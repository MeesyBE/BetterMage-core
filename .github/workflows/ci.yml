name: CI — BetterMagento Core (FIXED v0)

# FIX t.o.v. huidige ci.yml: oude file luisterde naar paths 'packages/core/**'
# en working-directory 'packages/core', maar de repo-root IS de module.
# Daardoor liep CI nooit. Deze versie draait op de echte root.
on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: xdebug
      - name: Adobe repo auth
        run: composer config --global http-basic.repo.magento.com ${{ secrets.MAGENTO_PUBLIC_KEY }} ${{ secrets.MAGENTO_PRIVATE_KEY }}
      - name: Composer install
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Run PHPUnit (unit only)
        run: ./vendor/bin/phpunit --testdox

  phpstan:
    name: PHPStan level 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - name: Adobe repo auth
        run: composer config --global http-basic.repo.magento.com ${{ secrets.MAGENTO_PUBLIC_KEY }} ${{ secrets.MAGENTO_PRIVATE_KEY }}
      - name: Composer install
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --no-progress

  integration:
    name: Integration (standalone, skips OK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - name: Adobe repo auth
        run: composer config --global http-basic.repo.magento.com ${{ secrets.MAGENTO_PUBLIC_KEY }} ${{ secrets.MAGENTO_PRIVATE_KEY }}
      - name: Composer install
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Run integration tests
        run: ./vendor/bin/phpunit -c phpunit.integration.xml.dist --testdox
